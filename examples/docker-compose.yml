# Local Vault + plugin directory. Good for demos, GIFs, and dev.to walkthroughs.
#
# 1. Build the plugin into ./plugin/:
#    ./examples/build-plugin.sh
# 2. Register once (from host, with vault CLI):
#    export VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root
#    SHA=$(sha256sum examples/plugin/vault-plugin-secrets-blockchain | awk '{print $1}')
#    vault plugin register -sha256="$SHA" secret vault-plugin-secrets-blockchain
#    vault secrets enable -path=blockchain -plugin-name=vault-plugin-secrets-blockchain plugin
# 3. Apply policies: see policies/README.md
#
# Then: vault write blockchain/chains/ethereum/wallets/demo chain=ethereum name=demo

services:
  vault:
    image: hashicorp/vault:1.15
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: >
      vault server
      -dev
      -dev-root-token-id=root
      -dev-plugin-dir=/vault/plugins
      -log-level=info
    ports:
      - "8200:8200"
    volumes:
      - ./plugin:/vault/plugins
    cap_add:
      - IPC_LOCK
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8200/v1/sys/health?standbyok=true",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
